# ============================================================================
# 模型推理 & 验证默认参数
# ============================================================================
# 被 TwoStagePipeline / FastAPI server / model.val() / model.predict() 使用
#
# 修改指南:
#   - 修改后无需重新训练，重启服务即可生效
#   - conf 阈值调高 = 更少误检，调低 = 更多召回
#   - iou 阈值调高 = 更少重叠框，调低 = 更多候选框
# ============================================================================

# ── YOLO 通用推理参数 ────────────────────────────────────────────
conf: 0.25              # 默认置信度阈值 (predict 模式)
iou: 0.7                # NMS IoU 阈值
max_det: 300            # 每张图最大检测数
imgsz: 1024             # 推理图像尺寸
half: false             # FP16 推理 (TensorRT 导出时设为 true)
augment: false          # 测试时增强 (TTA)
agnostic_nms: false     # 类别无关 NMS

# ── 验证参数 ──────────────────────────────────────────────────────
val_conf: 0.001         # 验证时置信度阈值 (极低以计算完整 mAP)
val_iou: 0.7            # 验证时 NMS IoU

# ── 两阶段推理管线参数 ───────────────────────────────────────────
roi_conf: 0.15          # Stage 1 ROI 检测置信度阈值
defect_conf: 0.40       # Stage 2 缺陷检测置信度阈值
slice_size: 1024        # 切片尺寸 (像素)
overlap: 0.15           # 切片重叠比例
downsample_ratio: 8     # ROI 下采样倍率

# ── WBF 融合参数 (双 GPU 模式) ──────────────────────────────────
wbf_iou: 0.55           # WBF IoU 合并阈值
wbf_dual_conf: 0.50     # 双 GPU 一致检测置信度
wbf_single_conf: 0.75   # 单 GPU 高置信度直通
wbf_final_conf: 0.60    # 最终输出置信度过滤
