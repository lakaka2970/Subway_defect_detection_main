# ============================================================================
# C3 Fine-Tune — 低学习率微调，最小增强 (v2 优化版)
# ============================================================================
# 目标: 在 C2 best 基础上继续提升 mAP50
#
# 使用方式:
#   c3 = {**load_train_config("finetune"), **base}
#   model.train(name="c3_finetune", **c3)
#
# v2 优化要点 (2025-06-25):
#   - imgsz 1024 → 1280: 与C2训练分辨率一致
#   - optimizer SGD → AdamW: 与C2保持一致, Run B实证AdamW的C3收益(+0.066 vs SGD +0.053)
#   - epochs 50 → 100: 给更长时间从C2平台继续提升
#   - YOLO内置EMA始终开启, 防止C3退化(Run D出现C3反向退化-0.018)
#   - lr0 0.0001 → 0.00005: AdamW下更低LR, 仅做最终微调
#   - warmup_epochs 3 → 5: 与更长epoch匹配
#
# 修改指南:
#   - lr0: AdamW下1e-4~5e-5是安全的精调范围
#   - 若C3出现退化, 先降低lr0, 再考虑缩短epochs
#   - 若C3提升明显, 可适当增大epochs到150
# ============================================================================

epochs: 100
imgsz: 1280
batch: 8
optimizer: AdamW
lr0: 0.00005
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: false

# ── 数据增强 (极轻量 — 仅保留颜色和几何基础变换) ──
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
copy_paste_mode: flip
hsv_h: 0.01
hsv_s: 0.4
hsv_v: 0.3
degrees: 2.0
translate: 0.1
scale: 0.3
shear: 1.0
perspective: 0.0
flipud: 0.0
fliplr: 0.3
close_mosaic: 0
erasing: 0.0             # fine-tune阶段保持0 — 不破坏缺陷细节
auto_augment: randaugment
