# ============================================================================
# C3 Fine-Tune — 低学习率微调，最小增强
# ============================================================================
# 目标: 在 C2 best 基础上继续提升 mAP50
#
# 使用方式:
#   c3 = {**load_train_config("finetune"), **base}
#   model.train(name="c3_finetune", **c3)
#
# 修改指南:
#   - lr0: 1e-4 是安全起点，若 C2 提升不大可提高到 5e-4
#   - copy_paste: fine-tune 阶段应为 0 (使用真实数据)
#   - erasing: fine-tune 阶段应为 0 (避免破坏缺陷细节)
# ============================================================================

epochs: 50
imgsz: 1024
batch: 8
optimizer: SGD
lr0: 0.0001
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: false

# ── 数据增强 (极轻量 — 仅保留颜色和几何基础变换) ──
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
copy_paste_mode: flip
hsv_h: 0.01
hsv_s: 0.4
hsv_v: 0.3
degrees: 2.0
translate: 0.1
scale: 0.3
shear: 1.0
perspective: 0.0
flipud: 0.0
fliplr: 0.3
close_mosaic: 0
erasing: 0.0
auto_augment: randaugment
