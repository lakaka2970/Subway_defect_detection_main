# ============================================================================
# C2 Full Training — 解冻全部层，完整训练  [LEGACY — 推荐用 pretrain/]
# ============================================================================
#
# ⚠ LEGACY: 此配置保留向后兼容。新训练推荐使用现代五阶段配置:
#     config/train/pretrain/stage2_scale_adaptation.yaml
#     用法: train-defect --data ... --stages 1 2 3 --pretrain-config-dir
#
# 目标: mAP50 在 C1 基础上大幅提升
#
# 使用方式:
#   c2 = {**load_train_config("full"), **base}
#   model.train(name="c2_full", **c2)
#
# v2 优化要点 (2025-06-25):
#   - imgsz 1024 → 1280: 缺陷从8px→10px, P3特征从1.0→1.25像素
#   - optimizer SGD → AdamW: 自适应学习率补偿C1→C2动量丢失
#   - lr0 保持0.001: AdamW推荐比SGD低一个数量级
#   - multi_scale true: 随机±50% imgsz, 学习尺度不变特征
#   - YOLO内置EMA始终开启, 无需额外配置
#   - mosaic 0.5 → 0.3: 减少对小目标的2×2缩略破坏
#   - copy_paste 0.3 → 0.0: 小目标场景禁用, 避免伪影
#   - erasing 0.4 → 0.1: 大幅降低, 保护8-10px缺陷不被擦除
#   - scale 0.5 → 0.7: 更大缩放范围增强尺度不变性
#   - close_mosaic 15 → 40: 更长无mosaic纯净训练期
#   - epochs 200 → 300: 配合更高分辨率和更低LR需要更多迭代
#   - warmup_epochs 5 → 10: 更长过渡, 补偿骨干网冷启动
#
# 修改指南:
#   - 若VRAM不足, 先降低 batch 再考虑降低 imgsz
#   - 若C2收敛仍缓慢, 可尝试 lr0=0.003 (AdamW)
#   - 若过拟合(训练loss降但val升), 增加 weight_decay 或降低 epochs
# ============================================================================

epochs: 300
imgsz: 1280
batch: 16
multi_scale: 0.5        # ±50% imgsz随机变化 (640~1920), 学习尺度不变特征

optimizer: AdamW
lr0: 0.001
lrf: 0.02
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 10
warmup_momentum: 0.5
warmup_bias_lr: 0.05
cos_lr: true

# ── 数据增强 (降低对小目标的破坏) ──
mosaic: 0.3
mixup: 0.0
copy_paste: 0.0        # 小目标场景禁用 — 避免8-10px缺陷的二次resize伪影
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.6
degrees: 5.0
translate: 0.15
scale: 0.7             # 0.5→0.7, 范围[0.3, 1.7], 增强尺度不变性
shear: 2.0
perspective: 0.0005
flipud: 0.0
fliplr: 0.5
close_mosaic: 40       # 15→40, 最后40epoch(13%)关闭mosaic, 在真实图像上精调
erasing: 0.1           # 0.4→0.1, 大幅降低随机擦除, 保护8-10px小目标
auto_augment: randaugment
