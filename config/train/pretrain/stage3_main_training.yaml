# ============================================================================
# Stage 3: Main Training — Native Resolution (unified training pipeline v2)
# ============================================================================
# Migrated from: stage2_scale_adaptation.yaml, Phase 5, S2, C2
#
# 目标: 全解冻, 1280 原生分辨率, 学习小目标尺度不变特征
#       这是主训练阶段 — 贡献最大的 mAP 提升
# 初始化: Stage 2 best.pt
# 数据: subway_crops (接触网缺陷, 7 类)
# 输入: 1280 (固定, 不推荐 YOLO 默认 ±50% 的大范围 multi_scale)
#
# v2 changes (2026-06-27):
#   - epochs: 120 → 80 (peak observed at epoch ~57, later epochs degrade)
#   - patience: 40 → 28 (tighter early stop)
#   - close_mosaic: 40 → 35 (adjusted proportionally)
#   - lr0: 0.0008 → 0.0005 (slightly lower for stability)
#   - warmup_epochs: 8 → 3 (shorter warmup, pretrained weights are stable)
#   - weight_decay: 0.0005 → 0.00075 (mildly stronger regularization)
#   - mosaic: 0.2 → 0.15 (less distortion for real-image convergence)
#   - save_period: 5 (checkpoint every 5 epochs for post-hoc selection)
#   - hsv_v: 0.5 → 0.6 (better tunnel lighting variance coverage)
# ============================================================================

# ── 数据集 ──
path: data/subway_crops
train: train/images
val: val/images
nc: 7
names: ["VHBNM", "VHBNL", "SVHBNM", "SVHBNL", "SVHTNL", "CBHPM", "CBVPM"]

epochs: 80
imgsz: 1280
batch: 12
optimizer: AdamW
lr0: 0.0005
lrf: 0.02
momentum: 0.937
warmup_epochs: 3
warmup_momentum: 0.5
warmup_bias_lr: 0.0005
weight_decay: 0.00075
cos_lr: true
patience: 28
save_period: 5

# ── 数据增强 (弱增强, 保护小目标) ──
mosaic: 0.15
mixup: 0.0
copy_paste: 0.05         # v2: 缺陷感知 Copy-Paste (离线生成, 小目标专用)
erasing: 0.0            # 保护 8-10px 小目标不被随机擦除
hsv_h: 0.015
hsv_s: 0.6
hsv_v: 0.6
degrees: 4.0
translate: 0.12
scale: 0.45
shear: 1.0
perspective: 0.0002
flipud: 0.0
fliplr: 0.5
close_mosaic: 35
auto_augment: randaugment
