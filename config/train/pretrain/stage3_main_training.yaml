# ============================================================================
# Stage 3: Main Training (1280px, single-phase) — 16-class on train_data_3
# ============================================================================
# Updated: 2026-08-12 for train_data_3 (raw pool + fresh augmentation)
# Raw pool: ~3985 images (Defect_dataset_2 + Defect_dataset CBHPM/CBVPM),
# plus ~7723 offline augmentation variants in the train split only.
# Key adjustments: WIoU loss, AdamW optimizer, tuned class weights
#
# Data distribution (train_data_3_raw, 12 active classes):
#   VHBNM:68   VHBNL:415  SVHBNM:166  SVHBNL:257  SVHTNL:354  CBHPM:214
#   CBVPM:290  GWCNM:162  GWCNL:391   BSBM:162    INSD:126    DRPS:175
#
# 4 zero-sample classes (RHTBNM,RHTBNL,GWCSBNM,GWCSBNL) are EXCLUDED this
# round — 0-weight, no loss contribution, head dim kept for future expansion

train: train/images
val: val/images
nc: 16
names:
  - VHBNM
  - VHBNL
  - SVHBNM
  - SVHBNL
  - SVHTNL
  - CBHPM
  - CBVPM
  - RHTBNM
  - RHTBNL
  - GWCSBNM
  - GWCSBNL
  - GWCNM
  - GWCNL
  - BSBM
  - INSD
  - DRPS

# ── Training schedule ──
epochs: 60
imgsz: 1280
batch: 16
workers: 8
persistent_workers: true
dataloader_workers_context: spawn

# ── Optimizer ──
optimizer: AdamW
lr0: 0.0002
lrf: 0.05
warmup_epochs: 3
warmup_momentum: 0.5
warmup_bias_lr: 0.0002
weight_decay: 0.00075
cos_lr: true
patience: 20
save_period: 5

# ── Data augmentation ──
mosaic: 0.5
mixup: 0.1
copy_paste: 0.3
erasing: 0.0
hsv_h: 0.015
hsv_s: 0.3
hsv_v: 0.3
degrees: 2.0
translate: 0.05
scale: 0.2
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 50
auto_augment: none
amp: false
cache: false
path: data/train_data_3
seed: 0
conf: 0.01
multi_scale: 0.0

# ── Loss ──
fl_gamma: 2.0
iou_type: WIoU

# ── Class weights (train_data_3, 2026-08-12) ──
# RHTBNM,RHTBNL,GWCSBNM,GWCSBNL = 0.0 (excluded this round — no loss)
# CBHPM = 1.0 (ample after +313 Defect_dataset merge)
# CBVPM = 0.8 (feature-obvious; keep low to curb FP)
# VHBNM,SVHBNM = 1.0 (moderate difficulty)
# INSD = 0.9 (moderate but high FN risk)
# SVHTNL = 1.3 (moderate-hard, direction-sensitive)
# SVHBNL = 1.5 (hard, visual subtlety)
# DRPS,BSBM = 1.2 (variable morphology, high FP risk)
# GWCNM = 1.5 (high FP — emphasise true positives)
# GWCNL = 1.0 (excellent, keep neutral)
# VHBNL = 1.5 (hard, highest FP+FN in 8.9 report)
class_weights:
  - 1.0     # 0: VHBNM
  - 1.5     # 1: VHBNL (hardest, high FP+FN)
  - 1.0     # 2: SVHBNM
  - 1.5     # 3: SVHBNL (hard, visual subtlety)
  - 1.3     # 4: SVHTNL (direction-sensitive)
  - 1.0     # 5: CBHPM (ample after merge)
  - 0.8     # 6: CBVPM (easy; low weight curbs FP)
  - 0.0     # 7: RHTBNM (excluded)
  - 0.0     # 8: RHTBNL (excluded)
  - 0.0     # 9: GWCSBNM (excluded)
  - 0.0     # 10: GWCSBNL (excluded)
  - 1.5     # 11: GWCNM (high FP)
  - 1.0     # 12: GWCNL (excellent)
  - 1.2     # 13: BSBM (variable, high FP risk)
  - 0.9     # 14: INSD (high FN risk)
  - 1.2     # 15: DRPS (variable morphology, high FP)
