# ============================================================================
# Stage 1: Neck + Head Warmup (modern 5-stage pipeline)
# ============================================================================
# 目标: 让检测头和 attention 模块先适应接触网 crop 上的小目标分布
# 初始化: COCO yolo11s.pt 或 yolo11s-P2-EMA-SimAM.yaml
# 数据: 自制 subway_crops (1024 native resolution crops)
# 类别: 7 类接触网缺陷
# 输出: stage1_warmup/weights/best.pt
#
# 与 legacy C1 的区别:
#   - 不仅训练 head, 还训练 neck + attention (freeze 更少)
#   - AdamW 替代 SGD
#   - 极轻增强 (mosaic≤0.2, 无 erasing/copy_paste)
#   - 30-50 epochs (比 legacy C1 短, neck 收敛更快)
# ============================================================================

epochs: 50
imgsz: 1024
batch: 16
optimizer: AdamW
lr0: 0.001
lrf: 1.0
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: false

# ── 数据增强 (轻量 — neck/head warmup 以收敛为主) ──
mosaic: 0.2
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.5
degrees: 3.0
translate: 0.1
scale: 0.4
shear: 1.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 0
erasing: 0.0
auto_augment: randaugment

# ── 冻结 backbone 前 60% 层, 训练 neck + P2/P3/P4/P5 + attention ──
freeze: [0, 1, 2, 3, 4, 5, 6, 7]
