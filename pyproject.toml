[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subway_defect"
version = "0.1.0"
description = "Subway catenary defect detection system using YOLO with EMA/SimAM attention"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0" }
keywords = ["subway", "catenary", "defect-detection", "YOLO", "computer-vision"]
authors = [
    { name = "Subway Defect Detection Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.23.0",
    "opencv-python>=4.8.0",
    "pillow>=9.4.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "tqdm>=4.64.0",
    "psutil>=5.9.0",
    "py-cpuinfo>=8.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "ultralytics>=8.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]

[project.scripts]
train-defect = "subway_defect.train.train_defect:main"
train-roi = "subway_defect.train.train_roi:main"
synthesize-defects = "subway_defect.synthetic.defect_synthesis:main"
export-tensorrt = "subway_defect.deployment.export_tensorrt:main"
subway-server = "subway_defect.deployment.fastapi_server:main"

[tool.setuptools.packages.find]
include = ["subway_defect*", "subway_yolo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:asyncio"
