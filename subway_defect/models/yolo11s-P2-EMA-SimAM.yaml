# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11s-P2 object detection model with EMA + SimAM attention (Lite)
#
# Vehicle-side (车载端) P2 variant — single RTX 4090
# Target: <=10s per 127MP image, Recall >=90%, Precision >=90%
#
# Key innovation: P2/4 detection scale added for tiny defects (bolts, split pins
# ~8×8 px at 1024 input). This is the P0 structural fix — without P2, ~40 px
# defects in 5120 originals shrink to ~8 px → ~1 px feature at P3, invisible at P4/P5.
#
# Attention design (re-allocated per Structure-improvement-plam):
#   P2 branch: SimAM — tiny defect localization (parameter-free energy attention,
#               identifies "surprisingly different" neurons, ideal for local
#               anomalies like missing bolts in regular structures)
#   P3 branch: EMA   — small object classification + spatial encoding
#               (X/Y directional pooling preserves position information)
#   P4 branch: SimAM — medium object context assistance
#   P5 branch: none  — structural context only, no detection responsibility
#   Backbone:  C2PSA (native YOLO11, retained)
#
# Estimated: ~9.8M params, ~30 GFLOPs @ 1024, ~48 GFLOPs @ 1280
# (within RTX 4090 ≤10s constraint with SAHI two-stage pipeline)

# Parameters
nc: 18  # number of defect classes (see defect dictionary)
scales:
  s: [0.50, 0.50, 1024]  # depth, width, max_channels (lite — vehicle-side)
  m: [0.50, 1.00, 512]   # for m-size variant, change scale parameter

# YOLO11 backbone (unchanged)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10 (native C2PSA retained)

# YOLO11-P2 head (4-scale: P2, P3, P4, P5)
head:
  # ── FPN up-sample path ──────────────────────────────────────────
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 (cat backbone P4)
  - [-1, 2, C3k2, [512, False]]                    # 13

  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 (cat backbone P3)
  - [-1, 2, C3k2, [256, False]]                    # 16 (P3/8-small)

  # P3 → P2 (NEW: P2 detection scale for tiny defects)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 2], 1, Concat, [1]]                     # 18 (cat backbone P2)
  - [-1, 2, C3k2, [128, False]]                    # 19 (P2/4-xsmall)
  - [-1, 1, SimAM, []]                              # 20 SimAM — tiny defect localization

  # ── PAN down-sample path ────────────────────────────────────────
  # P2 → P3
  - [-1, 1, Conv, [128, 3, 2]]                    # 21
  - [[-1, 16], 1, Concat, [1]]                     # 22 (cat head P3)
  - [-1, 2, C3k2, [256, False]]                    # 23 (P3/8-small)
  - [-1, 1, EMA, []]                                # 24 EMA — spatial encoding (P3)

  # P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                    # 25
  - [[-1, 13], 1, Concat, [1]]                     # 26 (cat head P4)
  - [-1, 2, C3k2, [512, False]]                    # 27 (P4/16-medium)
  - [-1, 1, SimAM, []]                              # 28 SimAM — context assistance (P4)

  # P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                    # 29
  - [[-1, 10], 1, Concat, [1]]                     # 30 (cat backbone P5 / C2PSA)
  - [-1, 2, C3k2, [1024, True]]                    # 31 (P5/32-large — structural context)
  # No attention at P5 — defects invisible at 32× downsample

  # Detection heads (4 scales: P2, P3, P4, P5)
  - [[20, 24, 28, 31], 1, Detect, [nc]]           # 32 Detect(P2, P3, P4, P5)
