# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11s object detection model with EMA + SimAM attention
#
# Vehicle-side (车载端) model — single RTX 4090
# Target: <=10s per 127MP image, Recall >=90%, Precision >=90%
#
# Attention design (v2 optimized, 2025-06-25):
#   P3 branch: EMA + SimAM (串联) — spatial encoding + local anomaly sensitivity
#               EMA gives X/Y directional pooling for position-aware features;
#               SimAM gives parameter-free energy attention for "surprisingly
#               different" neurons — ideal for defect textures.
#   P4 branch: SimAM — medium object context assistance
#   P5 branch: none  — defects invisible at 32× downsample; removing attention
#               here avoids reinforcing background structure noise
#   Backbone:  C2PSA (native YOLO11, retained)
#
# v2 changelog:
#   - P3: EMA only → EMA + SimAM (dual attention for the most critical scale)
#   - P5: SimAM removed (wasted computation + potential noise amplification)
#   - See docs/plans/2026-06-25-Structure-improvement-plam.md §二.2

# Parameters
nc: 18  # number of defect classes (see defect dictionary)
scales:
  s: [0.50, 0.50, 1024]  # depth, width, max_channels
  m: [0.50, 1.00, 512]   # for m-size variant, change scale parameter

# YOLO11 backbone (unchanged)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10 (native C2PSA retained)

# YOLO11 head (v2 optimized attention layout)
head:
  # ── FPN up-sample path ──────────────────────────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 (cat backbone P4)
  - [-1, 2, C3k2, [512, False]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 (cat backbone P3)
  - [-1, 2, C3k2, [256, False]]                    # 16 (P3/8-small)
  - [-1, 1, EMA, []]                                # 17 EMA — spatial encoding (P3)
  - [-1, 1, SimAM, []]                              # 18 SimAM — local anomaly (P3)

  # ── PAN down-sample path ────────────────────────────────────────
  - [-1, 1, Conv, [256, 3, 2]]                    # 19
  - [[-1, 13], 1, Concat, [1]]                     # 20 (cat head P4)
  - [-1, 2, C3k2, [512, False]]                    # 21 (P4/16-medium)
  - [-1, 1, SimAM, []]                              # 22 SimAM — context assistance (P4)

  - [-1, 1, Conv, [512, 3, 2]]                    # 23
  - [[-1, 10], 1, Concat, [1]]                     # 24 (cat backbone P5)
  - [-1, 2, C3k2, [1024, True]]                    # 25 (P5/32-large — structural context)
  # No attention at P5 — defects invisible at 32× downsample;
  # attention here would amplify background structure noise.

  # Detection heads (3 scales: P3, P4, P5)
  # P3: EMA + SimAM (dual attention), P4: SimAM, P5: no attention
  - [[18, 22, 25], 1, Detect, [nc]]               # 26 Detect(P3, P4, P5)
