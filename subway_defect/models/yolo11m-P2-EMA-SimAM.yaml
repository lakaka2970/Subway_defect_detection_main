# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11m-P2 object detection model with EMA + SimAM mixed attention
#
# Ground-side (地面端) P2 variant for tiny-object detection
# Target: Recall >=90%, Precision >=90%, combined false-report rate <=5%
#
# Key difference from yolo11m-EMA-SimAM:
#   Adds P2 detection layer (4× downsampling, ~256×256 @ 1024 input)
#   for enhanced tiny-object detection (bolts, nuts ~8×8 px at 1280).
#
# Attention design (4-scale mixed):
#   P2 branch: SimAM — parameter-free spatial attention (tiny defects ~4-8px)
#   P3 branch: EMA   — cross-spatial multi-scale attention (small defects ~8-16px)
#   P4 branch: SimAM — parameter-free spatial attention (medium structure ~16-32px)
#   P5 branch: ECA   — efficient channel attention (large context ~32-64px)
#   Backbone:  C2PSA (native YOLO11, retained)
#
# This model pairs with yolo11m-EMA-SimAM.yaml for WBF ensemble fusion,
# or can be used standalone as the primary detector.

# Parameters
nc: 18
scales:
  m: [0.50, 1.00, 512]

backbone:
  # Standard YOLO11m backbone — shared with 3-scale variant
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

head:
  # ── Top-down FPN (P5 → P4 → P3 → P2) ──
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11  P5 up
  - [[-1, 6], 1, Concat, [1]]                     # 12  cat P4
  - [-1, 2, C3k2, [512, False]]                    # 13  P4 neck

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14  P4 up
  - [[-1, 4], 1, Concat, [1]]                     # 15  cat P3
  - [-1, 2, C3k2, [256, False]]                    # 16  P3 neck (pre-attention)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17  P3 up  (NEW P2 path)
  - [[-1, 2], 1, Concat, [1]]                     # 18  cat backbone P2
  - [-1, 2, C3k2, [128, False]]                    # 19  P2/4 feature
  - [-1, 1, SimAM, []]                              # 20  SimAM (P2, tiny objects ~4-8px)

  # ── Bottom-up PAN (P2 → P3 → P4 → P5) ──
  - [-1, 1, Conv, [128, 3, 2]]                    # 21  P2 down
  - [[-1, 16], 1, Concat, [1]]                     # 22  cat P3 neck
  - [-1, 2, C3k2, [256, False]]                    # 23  P3/8 feature
  - [-1, 1, EMA, []]                                # 24  EMA (P3, small objects ~8-16px)

  - [-1, 1, Conv, [256, 3, 2]]                    # 25  P3 down
  - [[-1, 13], 1, Concat, [1]]                     # 26  cat P4 neck
  - [-1, 2, C3k2, [512, False]]                    # 27  P4/16 feature
  - [-1, 1, SimAM, []]                              # 28  SimAM (P4, medium structure ~16-32px)

  - [-1, 1, Conv, [512, 3, 2]]                    # 29  P4 down
  - [[-1, 10], 1, Concat, [1]]                     # 30  cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                    # 31  P5/32 feature
  - [-1, 1, ECA, []]                                # 32  ECA (P5, large context ~32-64px)

  # ── Detection (4 scales) ──
  - [[20, 24, 28, 32], 1, Detect, [nc]]           # 33  Detect(P2, P3, P4, P5)
